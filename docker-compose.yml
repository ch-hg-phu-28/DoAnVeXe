# PostgreSQL + Redis cho máy dev. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: datve
      POSTGRES_PASSWORD: datve
      POSTGRES_DB: datve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datve"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
